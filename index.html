<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pokeapi-manager</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg bg-dark text-light m-auto container-fluid"
    >
      <div class="container-fluid">
        <div class="navbar-brand text-light">
          <a class="nav-link" href="#">PokéManager</a>
        </div>
        <button
          class="navbar-toggler bg-light"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <form class="d-flex ms-auto me-2 m-2" role="search">
            <input
              class="form-control"
              type="search"
              id="searchInput"
              placeholder="Search"
              aria-label="Search"
            />
          </form>
          <ul class="navbar-nav mb-2 mb-lg-0">
            <li class="nav-item dropdown text-light">
              <a
                class="nav-link dropdown-toggle text-dark bg-light rounded-3"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                todos os tipos
              </a>
              <ul
                class="dropdown-menu text-light"
                style="list-style: none"
                id="typeDropdown"
              >
                <li>
                  <a class="dropdown-item" href="#" data-type="fire">fire</a>
                </li>
                <li>
                  <a class="dropdown-item" href="#" data-type="water">water</a>
                </li>
                <li>
                  <a class="dropdown-item" href="#" data-type="poison"
                    >poison</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="#" data-type="grass">grass</a>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      <div class="d-flex align-items-center gap-2">
        <img src="/img/heart-fill.svg" alt="coração" class="underline-img" />
        <h5 class="mb-0 opacity-50">Meus Favoritos</h5>
      </div>
      <hr class="opacity-25" />
    </div>

    <div class="container mt-5" id="favoritesSection">
      <div id="favoritesList" class="row g-4" style="display: none"></div>
    </div>

    <div class="container mt-5">
      <div class="d-flex align-items-center gap-2">
        <i class="fa-solid fa-globe text-primary fs-5"></i>
        <h5 class="mb-0 opacity-50">Base de Dados Globais</h5>
      </div>
      <hr class="opacity-25" />
    </div>

    <div class="container mt-5">
      <div id="pokemonContainer" class="row g-4"></div>
      <div id="loadingSpinner" class="text-center mt-4" style="display: none">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Carregando...</span>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
